[project]
name = "just-make-it"
version = "0.1.0"
description = "스프린트 AI12기 4팀 고급 프로젝트 - 소상공인 광고 파트너"
readme = "README.md"
authors = [
    { name = "joelchoi85", email = "jymania@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.67.0",
    "openai>=3.35.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
just-make-it = "just_make_it:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
