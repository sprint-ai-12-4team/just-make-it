[project]
name = "just-make-it"
version = "0.1.0"
description = "스프린트 AI12기 4팀 고급 프로젝트 - 소상공인 광고 파트너"
readme = "README.md"
authors = [
    { name = "joelchoi85", email = "jymania@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "openai>=3.35.1",
    "pillow>=10.3",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
just-make-it = "just_make_it:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=24.4",
    "httpx>=0.27",
    "pytest>=9.1.1",
    "ruff>=0.6",
]

# ---------------------------------------------------------------------------
# Code style: 포맷은 Black, 린트는 Ruff (팀 결정)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"] # 줄 길이는 Black이 처리
